name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 200.141.2.70 >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        run: |
          # --delete removes anything not in the repo, so protect server-only files:
          # secrets (.env*) and photos stored only on the VPS (public/photoshoots)
          rsync -az --delete \
            --exclude node_modules \
            --exclude .next \
            --exclude .git \
            --exclude '.env*' \
            --exclude public/photoshoots \
            ./ root@200.141.2.70:/var/www/staysphere.imagesque.com/

      - name: Build and restart
        run: |
          ssh root@200.141.2.70 "cd /var/www/staysphere.imagesque.com && test -f .env.local || { echo '.env.local missing on VPS - aborting'; exit 1; } && npm install --production=false && rm -rf .next && npm run build && pm2 restart staysphere --update-env"
